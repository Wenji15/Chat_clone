<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的个人分身</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --accent: #4f6ef7;
      --text: #1f2430;
      --muted: #8a90a0;
      --bubble-user: #4f6ef7;
      --bubble-ai: #eceef5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      height: 100vh;
    }
    #app {
      width: 100%;
      max-width: 760px;
      display: flex;
      flex-direction: column;
      background: var(--card);
      box-shadow: 0 0 30px rgba(0,0,0,.06);
    }
    header {
      padding: 14px 20px;
      border-bottom: 1px solid #e6e8ef;
      font-weight: 600;
    }
    header .dot { color: var(--accent); }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg { max-width: 80%; padding: 10px 14px; border-radius: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
    .msg.user { align-self: flex-end; background: var(--bubble-user); color: #fff; border-bottom-right-radius: 4px; }
    .msg.ai { align-self: flex-start; background: var(--bubble-ai); border-bottom-left-radius: 4px; }
    .msg.thinking { color: var(--muted); font-style: italic; }
    #inputbar {
      display: flex;
      gap: 10px;
      padding: 14px 20px;
      border-top: 1px solid #e6e8ef;
    }
    #input {
      flex: 1;
      resize: none;
      border: 1px solid #d9dce5;
      border-radius: 10px;
      padding: 10px 12px;
      font: inherit;
      outline: none;
    }
    #input:focus { border-color: var(--accent); }
    #send {
      border: none;
      background: var(--accent);
      color: #fff;
      border-radius: 10px;
      padding: 0 22px;
      font: inherit;
      cursor: pointer;
    }
    #send:disabled { opacity: .5; cursor: not-allowed; }
  </style>
</head>
<body>
  <div id="app">
    <header>🤖 我的个人分身 <span class="dot">· 本地运行</span></header>
    <div id="messages">
      <div class="msg ai">你好，我是你的个人分身。有什么想聊的？</div>
    </div>
    <div id="inputbar">
      <textarea id="input" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
      <button id="send">发送</button>
    </div>
  </div>

  <script>
    const messages = document.getElementById('messages');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');

    function addMsg(text, role) {
      const div = document.createElement('div');
      div.className = 'msg ' + role;
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
      return div;
    }

    async function send() {
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      addMsg(text, 'user');
      const thinking = addMsg('思考中…', 'ai');
      thinking.classList.add('thinking');
      sendBtn.disabled = true;
      try {
        const resp = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text }),
        });
        const data = await resp.json();
        thinking.textContent = data.reply || '(空回复)';
        thinking.classList.remove('thinking');
      } catch (e) {
        thinking.textContent = '请求失败：' + e;
        thinking.classList.remove('thinking');
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    sendBtn.addEventListener('click', send);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });
  </script>
</body>
</html>
